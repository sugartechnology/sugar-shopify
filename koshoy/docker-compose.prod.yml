# Production Docker — koshoy.sugartech.io
#   cp .env.example .env.production   # fill in
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - koshoy_sqlite_prod:/app/data
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/prod.sqlite
      HOST: 0.0.0.0
      PORT: 3000

volumes:
  koshoy_sqlite_prod:
