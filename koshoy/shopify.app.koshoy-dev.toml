# Koshoy Dev — the dev line of Koshoy Studio, installed in the SAME Koshoy store.
# Storefront /apps/koshoy-dev/* → https://koshoy-dev.sugartech.io/apps/koshoy/*
# (same backend routes as live; only the storefront path and the host differ).
# Live config stays in shopify.app.toml; never point this file at koshoy.sugartech.io.
# https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "KOSHOY_DEV_CLIENT_ID"
name = "Koshoy Dev"
application_url = "https://koshoy-dev.sugartech.io"
embedded = true
web_directories = ["."]
extension_directories = []

[access_scopes]
scopes = "read_products,write_products,read_publications,write_publications"

[auth]
redirect_urls = [ "https://koshoy-dev.sugartech.io/auth/callback" ]

[app_proxy]
url = "https://koshoy-dev.sugartech.io/apps/koshoy"
subpath = "koshoy-dev"
prefix = "apps"

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[build]
automatically_update_urls_on_dev = false
